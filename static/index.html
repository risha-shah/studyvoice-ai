<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyVoice</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">PERSONAL AI PROJECT</div>
    <h1>StudyVoice</h1>
    <p>A voice-first AI study assistant for quick course questions.</p>
    <div id="status">Ready</div>
    <div class="row">
      <button id="talkBtn">🎙 Start talking</button>
      <button id="stopBtn">■ Stop voice</button>
    </div>
    <textarea id="question" rows="4" placeholder="Ask a course question..."></textarea>
    <button id="sendBtn" class="full">Ask StudyVoice</button>
    <section>
      <h3>AI response</h3>
      <div id="response">Your answer will appear here.</div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
